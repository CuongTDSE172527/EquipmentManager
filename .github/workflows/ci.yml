name: Kiểm tra và build thử
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.47.9'
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite_assets.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: test-coverage
          path: coverage/lcov.info
  android-smoke:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite_assets.py --android
        env:
          GH_TOKEN: ${{ github.token }}
      - run: flutter build apk --debug
  windows-smoke:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Helper cập nhật khởi động được khi app gọi từ Dart
        run: flutter test test/windows_update_launch_test.dart
      - run: flutter build windows --release
