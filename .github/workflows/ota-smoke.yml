name: Kiểm tra cài OTA Android
on:
  workflow_dispatch:
    inputs:
      apis:
        type: choice
        description: 'Android API cần kiểm tra'
        options: ['[26,33]', '[26]', '[33]']
        default: '[26,33]'
permissions:
  contents: read
jobs:
  native-update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite_assets.py --android
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build synthetic OTA APKs (never published)
        run: |
          flutter build apk --debug --target-platform=android-x64 --build-name=0.1.4 --build-number=1004
          cp build/app/outputs/flutter-apk/app-debug.apk ota-candidate.apk
          keytool -genkeypair -keystore /tmp/wrong-key.jks -storepass fixturepassword -keypass fixturepassword -alias fixture -keyalg RSA -validity 2 -dname 'CN=OTA Test Only'
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" sign --ks /tmp/wrong-key.jks --ks-pass pass:fixturepassword --key-pass pass:fixturepassword --out ota-wrong-signer.apk ota-candidate.apk
          flutter build apk --debug --target=integration_test/update_harness.dart --target-platform=android-x64 --build-name=0.1.3 --build-number=1003
          cp build/app/outputs/flutter-apk/app-debug.apk ota-harness.apk
      - name: Prepare emulator on disposable runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: python3 tool/check_android_update.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-native-api-${{ matrix.api }}
          path: |
            ota-result.txt
            ota-installer-window.xml
            ota-evidence.txt
            ota-logcat.txt
