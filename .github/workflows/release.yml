name: Phát hành EquipmentManager
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản thử (ví dụ 0.1.0); khi chạy bằng tag sẽ lấy tag'
        required: true
        default: '0.1.0'
      publish:
        description: 'Tạo Release sau khi build thành công'
        type: boolean
        default: false
permissions:
  contents: read
env:
  FLUTTER_VERSION: '3.47.9'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite_assets.py
        env:
          GH_TOKEN: ${{ github.token }}
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          GH_TOKEN: ${{ github.token }}
          ENFORCE_PROGRESS: ${{ github.ref_type == 'tag' || inputs.publish }}
        run: |
          if [ "$ENFORCE_PROGRESS" = "true" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > prior-releases.txt
            dart run tool/check_version.dart "$TAG" prior-releases.txt
          else
            dart run tool/check_version.dart "$TAG"
          fi
      - run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - run: dart run tool/generate_templates.dart
      - uses: actions/upload-artifact@v4
        with:
          name: excel-template
          path: assets/templates/EquipmentManager-mau-nhap.xlsx
  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get --enforce-lockfile
      - run: python3 tool/prepare_sqlite_assets.py --android
        env:
          GH_TOKEN: ${{ github.token }}
      - run: dart run tool/generate_templates.dart
      - name: Khôi phục khóa ký từ Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: python
        run: |
          import os, base64, pathlib
          names = ['ANDROID_KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit('Missing GitHub Secret: ' + name)
          pathlib.Path('android/app/release.keystore').write_bytes(base64.b64decode(os.environ[names[0]].strip(), validate=True))
          def escape(v):
              return v.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'storeFile': 'release.keystore', 'storePassword': os.environ[names[1]], 'keyAlias': os.environ[names[2]], 'keyPassword': os.environ[names[3]]}
          pathlib.Path('android/key.properties').write_text(''.join(k+'='+escape(v)+'\n' for k,v in values.items()), encoding='utf-8')
      - name: Build APK release đã ký
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          CODE: ${{ needs.checks.outputs.code }}
        run: |
          flutter build apk --release --build-name="$VERSION" --build-number="$CODE"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/EquipmentManager-$VERSION.apk"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "dist/EquipmentManager-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk
      - name: Xóa tệp chứa khóa trên runner
        if: always()
        run: rm -f android/app/release.keystore android/key.properties
  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/generate_templates.dart
      - name: Build Windows
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          BUILD_COUNTER: ${{ github.run_number }}
        run: flutter build windows --release --build-name="$env:VERSION" --build-number="$env:BUILD_COUNTER"
      - name: Đóng gói thư viện chạy, ZIP và bộ cài
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $crt = Get-ChildItem -LiteralPath "$vs\VC\Redist\MSVC" -Directory -Recurse -Filter 'Microsoft.VC*.CRT' | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$crt) { throw 'Visual C++ redistributable DLLs not found' }
          Copy-Item -Path "$($crt.FullName)\*.dll" -Destination 'build/windows/x64/runner/Release'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "dist/EquipmentManager-$env:VERSION-windows-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer/EquipmentManager.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
      - name: Test Windows update helper on disposable runner
        shell: pwsh
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          $headers = @{'User-Agent'='EquipmentManager-OTA-test'}
          $old = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v0.1.3" -Headers $headers
          foreach ($name in @('EquipmentManager-0.1.3-windows-portable.zip','EquipmentManager-0.1.3-windows-setup.exe')) {
            $asset = $old.assets | Where-Object name -EQ $name
            Invoke-WebRequest -Uri ($asset.url + '?download=1') -Headers @{'User-Agent'='EquipmentManager-OTA-test';'Accept'='application/octet-stream'} -OutFile "$env:RUNNER_TEMP/$name" -MaximumRetryCount 3 -RetryIntervalSec 3
            if (('sha256:' + (Get-FileHash "$env:RUNNER_TEMP/$name").Hash.ToLowerInvariant()) -ne $asset.digest) { throw 'Previous release hash mismatch' }
          }
          & ./tool/test_windows_update.ps1 -OldZip "$env:RUNNER_TEMP/EquipmentManager-0.1.3-windows-portable.zip" -NewZip "dist/EquipmentManager-$env:VERSION-windows-portable.zip" -Version $env:VERSION -FixtureRoot "$env:RUNNER_TEMP/equipment-ota-test" -OldSetup "$env:RUNNER_TEMP/EquipmentManager-0.1.3-windows-setup.exe" -NewSetup "dist/EquipmentManager-$env:VERSION-windows-setup.exe" -TestSetup
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.exe
            dist/*.zip
  publish:
    needs: [checks, android, windows]
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tạo Release có đủ APK, bộ cài, ZIP và mẫu Excel
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == 0.* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" dist/*.apk dist/*.exe dist/*.zip dist/*.xlsx --title "EquipmentManager $VERSION" --generate-notes --verify-tag "${flags[@]}"
