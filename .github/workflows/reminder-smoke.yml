name: Kiểm tra nhắc nền Android
on:
  workflow_dispatch:
    inputs:
      apis:
        description: 'Các API cần kiểm tra lại'
        type: choice
        options: ['[26,33]', '[26]', '[33]']
        default: '[26,33]'
permissions:
  contents: read
jobs:
  background-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(inputs.apis) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get --enforce-lockfile
      - name: Build isolated harness (never published)
        run: flutter build apk --debug --target=integration_test/reminder_harness.dart --target-platform=android-x64
      - name: Free disk for emulator on ephemeral runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          df -h /
      - name: Enable KVM on ephemeral CI runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tool/check_android_reminder.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reminder-evidence-api-${{ matrix.api }}
          path: |
            android-reminder-logcat.txt
            notification-dump.txt
